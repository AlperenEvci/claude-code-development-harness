name: Validate

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      # Both, and neither is optional. `ubuntu-latest` is authoritative: two
      # symlink tests skip on Windows and the POSIX permission-bit assertion only
      # runs there. But Windows is where this plugin is developed, and Linux-only
      # CI is exactly why a `python3` invocation shipped in the skills — the one
      # part an end user actually runs — and stayed broken through two fixes of
      # the same defect elsewhere. A platform nobody tests is a platform that
      # breaks quietly.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The one command AGENTS.md names as the full gate. CI used to reimplement a
      # subset of it inline, which left the gate script itself unexercised - and it
      # rotted: it invoked `python3`, which on Windows resolves to the Microsoft
      # Store alias stub, so the documented full gate could not run at all on the
      # primary development machine and nothing noticed, because nothing ran it.
      # Running the script here means the command developers are told to run is the
      # command CI runs.
      - name: Full gate
        shell: bash
        run: bash scripts/validate-repo.sh
