schema_version: "1.1"
name: trivial-work-skips-the-pipeline
description: >
  Two claims meet here. The generated harness promises that trivial work bypasses the
  research/spec/delegation pipeline - a promise the setup skill makes for every repo it
  writes, and the failure mode that makes a harness feel like an obstacle. And the
  plugin's own skills declare `disable-model-invocation: true`, which is supposed to
  keep them out of unrelated work. A one-word typo in a fully harnessed repository
  tests both at once: the right behavior is to open the file, fix the word, and stop.

  This case is not expected to beat the no-plugin baseline, and that is the point. A
  bare agent already fixes a typo without ceremony. What is being guarded is that
  installing the harness does not make it worse.

tags: [routing, generated-harness, over-orchestration, free-graders]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |
    There is a typo in the checkout button label in src/ui.js - it says "Sumbit"
    and should say "Submit". Fix it.
  max_turns: 10
  timeout_seconds: 360
  allowed_tools: [Read, Glob, Grep, Skill, Edit]

runs: 3

graders:
  - type: tool_used
    name: the-typo-was-actually-fixed
    tool: Edit
    input_match: "Submit"
    min: 1
    weight: 3

  - type: tool_used
    name: no-plugin-skill-fired-on-unrelated-work
    tool: Skill
    max: 0
    arm: both
    weight: 3

  - type: tool_used
    name: no-subagent-was-spawned-for-one-word
    tool: Task
    max: 0
    weight: 2

  - type: file_exists
    name: no-spec-was-written
    path: ".ai/specs/**"
    exists: false
    weight: 2

  - type: file_exists
    name: no-research-report-was-written
    path: ".ai/reports/**"
    exists: false
    weight: 2

  - type: file_exists
    name: no-decision-record-was-written
    path: ".ai/decisions/**"
    exists: false
