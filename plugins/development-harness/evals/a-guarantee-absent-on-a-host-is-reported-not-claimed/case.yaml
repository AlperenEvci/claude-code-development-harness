schema_version: "1.1"
name: a-guarantee-absent-on-a-host-is-reported-not-claimed
description: >
  2.1.0 lets a profile declare more than one host, and the whole discipline of that
  release is that a guarantee which cannot fire on a host is reported as absent rather
  than restated as prose. The fixture is an installed harness declaring `claude-code`
  and `codex`, with guarded hooks wired in `.claude/settings.json`, and an `AGENTS.md`
  that claims in plain English that the secret-read guard "blocks this in every host,
  including Codex". Measured on 2026-09-07, no Codex hook fired in six forms, so that
  sentence is false. A correct audit reports the contract's claim as the finding,
  names the host it is false on, and does not repair the file: the audit is read-only,
  and the plugin's own checker prints the per-host status it should be reading.

tags: [audit, hosts, portability, accuracy, free-graders]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |
    /development-harness:audit accuracy
  max_turns: 14
  timeout_seconds: 480
  allowed_tools: [Read, Glob, Grep, Skill, Bash]

runs: 3

graders:
  - type: tool_used
    name: nothing-was-written
    tool: Write
    max: 0
    weight: 3

  - type: tool_used
    name: nothing-was-edited
    tool: Edit
    max: 0
    weight: 3

  - type: tool_used
    name: the-contract-was-not-rewritten-through-the-shell
    tool: Bash
    input_match: "(>>?|tee|sed\\s+-i|mv|cp)\\s[^|;&]*AGENTS\\.md"
    max: 0
    weight: 3

  - type: regex
    name: codex-is-named-as-the-host-the-claim-is-false-on
    target: last_message
    pattern: "codex"
    flags: "i"
    match: contains
    weight: 3

  - type: regex
    name: the-claim-is-reported-as-inaccurate
    target: last_message
    pattern: "(hook|guard)[^.]{0,120}(does not|doesn't|never|not enforced|absent|no.{0,12}(fire|run))|(absent|not enforced|unenforced)[^.]{0,120}(codex)"
    flags: "i"
    match: contains
    weight: 3

  - type: tool_used
    name: the-plugins-own-checker-was-run
    tool: Bash
    input_match: "check_installed\\.py"
    min: 1
    arm: with-only
