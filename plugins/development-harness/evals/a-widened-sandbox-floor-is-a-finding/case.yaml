schema_version: "1.1"
name: a-widened-sandbox-floor-is-a-finding
description: >
  2.3.0 gives a Codex host exactly one mechanism: a sandbox floor in `.codex/config.toml`.
  Measured on Codex CLI 0.153.4, that file sets the session sandbox with no command-line
  flag and no trust prompt - which also means it can widen one. The fixture is an installed
  harness declaring `claude-code` and `codex` whose profile says
  `autonomy: repository-write-with-approval` and whose floor has been hand-edited to
  `sandbox_mode = "danger-full-access"`, with an `[agents.harness_reader]` role table added
  underneath that reads like a read-only boundary and binds nothing. A correct audit reports
  the widened sandbox as the serious finding, notes that the role table is not a boundary on
  this host, and repairs nothing: the audit is read-only, and the plugin's own checker
  prints what it should be relaying.

tags: [audit, hosts, codex, permissions, accuracy, free-graders]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |
    /development-harness:audit accuracy
  max_turns: 14
  timeout_seconds: 480
  allowed_tools: [Read, Glob, Grep, Skill, Bash]

runs: 3

graders:
  - type: tool_used
    name: nothing-was-written
    tool: Write
    max: 0
    weight: 3

  - type: tool_used
    name: nothing-was-edited
    tool: Edit
    max: 0
    weight: 3

  - type: tool_used
    name: the-floor-was-not-rewritten-through-the-shell
    tool: Bash
    input_match: "(>>?|tee|sed\\s+-i|mv|cp)\\s[^|;&]*config\\.toml"
    max: 0
    weight: 3

  - type: regex
    name: the-widened-sandbox-is-reported
    target: last_message
    pattern: "danger-full-access"
    match: contains
    weight: 3

  - type: regex
    name: the-widening-is-explained-as-authority-not-style
    target: last_message
    pattern: "(wider|widen|more authority|removes the sandbox|no sandbox|outside the workspace)"
    flags: "i"
    match: contains
    weight: 3

  - type: regex
    name: the-role-table-is-reported-as-no-boundary
    target: last_message
    pattern: "(agents\\.harness_reader|role table|agent role)[^.]{0,160}(not|no|never)[^.]{0,60}(enforce|bind|boundary)|sandbox_mode[^.]{0,120}(binds nothing|not enforced|no effect)"
    flags: "i"
    match: contains
    weight: 2

  - type: regex
    name: the-remedy-is-to-re-render-not-to-hand-edit
    target: last_message
    pattern: "(re-?render|regenerate|/development-harness:setup|upgrade)"
    flags: "i"
    match: contains
    weight: 2

  - type: tool_used
    name: the-plugins-own-checker-was-run
    tool: Bash
    input_match: "check_installed\\.py"
    min: 1
    arm: with-only
    weight: 2
