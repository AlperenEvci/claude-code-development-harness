schema_version: "1.1"
name: a-read-only-agent-that-can-delegate
description: >
  2.4.0 renders every OpenCode read-only agent as `mode: all` with `tools: { task: false }`,
  and both halves are measurements rather than style. On OpenCode 1.18.29 an agent's
  permission block does not reach what it delegates to: an agent declaring `edit: deny`,
  `write: deny` and `bash: deny` called `task`, and its delegate wrote the file. And
  `opencode run --agent` refuses a subagent-only name by falling back to the *default*
  agent while still exiting 0, so a `mode: subagent` file cannot carry a tier at all. The
  fixture is an installed harness declaring `claude-code` and `opencode` whose reviewer
  agent has been hand-edited back to `mode: subagent` with `task: true`, while its
  frontmatter still says it cannot edit or write. A correct audit reports that the
  agent can write through a delegate despite its own deny lines, and repairs nothing.

tags: [audit, hosts, opencode, permissions, accuracy, free-graders]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |
    /development-harness:audit accuracy
  max_turns: 14
  timeout_seconds: 480
  allowed_tools: [Read, Glob, Grep, Skill, Bash]

runs: 3

graders:
  - type: tool_used
    name: nothing-was-written
    tool: Write
    max: 0
    weight: 3

  - type: tool_used
    name: nothing-was-edited
    tool: Edit
    max: 0
    weight: 3

  - type: tool_used
    name: the-agent-file-was-not-rewritten-through-the-shell
    tool: Bash
    input_match: "(>>?|tee|sed\\s+-i|mv|cp)\\s[^|;&]*\\.opencode"
    max: 0
    weight: 3

  - type: regex
    name: the-delegation-hole-is-reported
    target: last_message
    pattern: "(task|delegat|sub-?agent)"
    flags: "i"
    match: contains
    weight: 3

  - type: regex
    name: it-is-reported-as-a-write-path-not-a-style-note
    target: last_message
    pattern: "(can still write|could write|writes? through|not read-?only|bypass|escape)"
    flags: "i"
    match: contains
    weight: 3

  - type: regex
    name: the-deny-lines-are-not-mistaken-for-the-whole-boundary
    target: last_message
    pattern: "(write: deny|edit: deny|permission block|deny lines)"
    flags: "i"
    match: contains
    weight: 2

  - type: regex
    name: the-remedy-is-to-re-render-not-to-hand-edit
    target: last_message
    pattern: "(re-?render|regenerate|/development-harness:setup|upgrade)"
    flags: "i"
    match: contains
    weight: 2

  - type: tool_used
    name: the-plugins-own-checker-was-run
    tool: Bash
    input_match: "check_installed\\.py"
    min: 1
    arm: with-only
    weight: 2
